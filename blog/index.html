---
layout: default
title: Blog
---
<h1>Blog</h1>

{% if site.posts.size == 0 %}
<p>Nothing here yet.</p>
{% else %}
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="date">{{ post.date | date: "%B %Y" }}</span>
  </li>
  {% endfor %}
</ul>
{% endif %}

<nav class="links">
  <a href="/">Home</a>
</nav>
